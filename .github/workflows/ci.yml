name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/ scripts/ migrations/

      - name: Type check
        run: mypy src/

      - name: Unit tests
        run: pytest tests/unit/ -q
        # src.main creates the AgentOS app during module import. This is a
        # format-valid non-secret fixture for unit-test collection; it never
        # enables Telegram or contacts Telegram.
        env:
          TELEGRAM_TOKEN: "000000000:ci-unit-test-token"

  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # The conftest fixture starts docker-compose postgres by itself
      # (same code path as local). REQUIRE_DB makes infra issues fail loud.
      - name: Integration tests (docker compose postgres)
        run: pytest tests/integration/ -q
        env:
          ANCORA_TEST_REQUIRE_DB: "1"

  collector-config:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ADR-006 / specs/013 T10: the versioned manifest must build and parse
      # with the pinned contrib image before rollout. Dummy Grafana values
      # only — this job never contacts Grafana Cloud.
      - name: Build Collector image (observability/Dockerfile)
        run: docker build -f observability/Dockerfile -t ancoramind-otel-collector:ci .

      - name: Validate Collector config
        run: >
          docker run --rm
          -e GRAFANA_OTLP_ENDPOINT=https://otlp-gateway-example.grafana.net/otlp
          -e GRAFANA_OTLP_AUTHORIZATION="Basic Y2k6ZHVtbXk="
          ancoramind-otel-collector:ci
          validate --config=/etc/otelcol/config.yaml