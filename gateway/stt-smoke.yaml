# Isolated local test only. Never publish/activate this configuration in production.
model_list:
  - model_name: ancoramind-stt-smoke-r1
    litellm_params:
      model: openai/openai/whisper-large-v3-turbo
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      num_retries: 0
router_settings:
  num_retries: 0
  fallbacks: []
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
litellm_settings:
  num_retries: 0
  set_verbose: false