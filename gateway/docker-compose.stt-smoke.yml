# Dedicated disposable DB, loopback only, no production aliases or persistent volumes.
services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smoke
      POSTGRES_PASSWORD: ${ANCORA_SMOKE_DB_PASSWORD:?Required ephemeral password}
      POSTGRES_DB: smoke
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smoke -d smoke"]
      interval: 2s
      timeout: 2s
      retries: 30
  gateway:
    image: ghcr.io/berriai/litellm@sha256:a3715fa7ad8387941ab697259bd2881d68931657247a41984f90fae6d11c62bf
    environment:
      DATABASE_URL: postgresql://smoke:${ANCORA_SMOKE_DB_PASSWORD}@database:5432/smoke
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Required ephemeral key}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?Required ephemeral salt}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Required upstream key}
      NO_DOCS: "True"
      NO_REDOC: "True"
      NO_OPENAPI: "True"
    volumes:
      - ./stt-smoke.yaml:/app/stt-smoke.yaml:ro
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:4001:4000"
    depends_on:
      database:
        condition: service_healthy
    command: ["--config", "/app/stt-smoke.yaml", "--host", "0.0.0.0", "--port", "4000", "--num_workers", "1", "--use_v2_migration_resolver"]