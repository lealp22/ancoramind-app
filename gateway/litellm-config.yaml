# T11/T12 LiteLLM Proxy pilot. This file contains no secrets: Railway injects
# DATABASE_URL, LITELLM_MASTER_KEY, LITELLM_SALT_KEY and OPENROUTER_API_KEY.
# Every user-facing model_name is an immutable AncoraMind RuntimeConfig alias.
# T12: retries/cross-model fallbacks stay at zero; the per-deployment circuit
# breaker (allowed_fails/cooldown_time) fast-fails during cooldown, and the
# model_info rpm/tpm entries are per-route capacity ceilings. The per-key
# RPM/TPM/max-parallel limits are applied on the AncoraMind virtual key by
# scripts/litellm_create_virtual_key.py.
#
# Model definitions follow a single additive policy (ADR-005 amendment):
# the aliases declared below are the immutable *base* (r1). A physical model
# change never edits an existing alias; it publishes a new versioned one
# (r2, r3, ...) through scripts/litellm_gateway_alias.py, which needs
# store_model_in_db. The database may only ADD aliases, never edit or delete
# a base alias. Settings (general_settings/router_settings/litellm_settings)
# must never be written through the management API: LiteLLM stores them in
# LiteLLM_Config and they would silently overlay this file at startup.

model_list:
  - model_name: ancoramind-default-r1
    litellm_params:
      model: openrouter/gpt-5.6-luna
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      rpm: 60
      tpm: 250000
  - model_name: ancoramind-fast-r1
    litellm_params:
      model: openrouter/gpt-5.6-luna
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      rpm: 60
      tpm: 250000
  - model_name: ancoramind-vision-r1
    litellm_params:
      model: openrouter/gpt-5.6-luna
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      rpm: 60
      tpm: 250000
  - model_name: ancoramind-embeddings-r1
    litellm_params:
      # Keep embeddings with the same OpenRouter upstream used by conversational
      # aliases so Gateway spend, limits and provider operations stay centralised.
      # The physical OpenAI model and its fixed 1536-dimensional vector contract
      # remain unchanged.
      model: openrouter/openai/text-embedding-3-small
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      rpm: 60
      tpm: 250000

router_settings:
  num_retries: 0
  # Circuit breaker (CLOSED -> OPEN -> HALF_OPEN): after more than
  # allowed_fails failures within a minute the deployment enters a
  # cooldown_time cooldown and the proxy fast-fails ("No deployments
  # available"); the first request after the cooldown probes the upstream
  # again. Matches runtime config gateway.cooldown_seconds (60).
  allowed_fails: 3
  cooldown_time: 60

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Additive model publication (ADR-005 amendment): aliases r2+ are published
  # at runtime through POST /model/new, so a physical model change no longer
  # requires a Gateway redeploy. Existing aliases are never mutated in place.
  store_model_in_db: true

litellm_settings:
  drop_params: false