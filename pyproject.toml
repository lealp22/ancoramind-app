[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ancoramind-core"
version = "0.1.0"
description = "AncoraMind — Personal AI assistant with operational memory"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}

dependencies = [
    "agno[os,telegram]>=2.9.0,<3.0.0",
    "psycopg[binary]>=3.2.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "cryptography>=45.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "PyMuPDF>=1.24.0,<2.0.0",
    "pymupdf4llm>=1.24.0,<2.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "openai>=1.0.0",
    "supabase>=2.5.0",
    "opentelemetry-api>=1.38.0,<2.0.0",
    "opentelemetry-sdk>=1.38.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.38.0,<2.0.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
ancoramind = "src.main:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "S"]
# S101 (assert) fires on mypy-strict type-narrowing asserts in runtime code
# just as often as on real security-relevant asserts — not a useful signal
# here. Everything else in S stays enforced project-wide.
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# DDL migrations legitimately interpolate code-level constants (enum lists,
# column names) into long literal SQL strings — never user input.
"migrations/versions/*.py" = ["E501", "S608"]
# "Hardcoded secrets" findings here are fixture literals, not real ones.
"tests/**/*.py" = ["S"]
# Operator-only CLI tooling: deliberate HTTP/subprocess calls to
# operator-provided URLs/paths.
"scripts/*.py" = ["S310", "S603", "S607", "S104"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests requiring a real PostgreSQL (docker compose — specs/009)",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
# BL-37: baseline measured on `pytest tests/unit/` (2026-10-07) was 76%.
# Integration tests cover a different slice (repositories/DB) and are not
# gated by this threshold — only the unit-test CI step passes --cov.
fail_under = 70